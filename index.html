<script id="ibom-sample1-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample1) {
      window.parent.navigateSample1(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 속성 기반 자동 매핑 (하단 네비게이션 바 & 헤더 & 관리자 메뉴)
  const pathMap = {
    'home': '홈.html',
    'baby-log-home': '육아기록.html',
    'community': '커뮤.html',
    'community-feed': '커뮤.html',
    'outing-map': '지도.html',
    'market': '마켓.html',
    'market-shop': '마켓.html',
    'my-page': '마이페이지.html',
    'mypage-settings': '마이페이지.html',
    'baby-growth': '아기.html',
    'dashboard': '관리자.html',
    'member-child-management': '아기.html',
    'community-moderation': '커뮤.html',
    'market-settlement': '마켓.html',
    'place-store-manager': '지도.html',
    'logs-monitoring': '육아기록.html',
    'system-settings': '관리자모바일.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 일정, 프로필 -> 마이페이지, 뒤로가기)
  const header = document.querySelector('header');
  if (header) {
    const logoArea = header.querySelector('.flex.items-center.gap-space-sm, .flex.items-center.gap-3');
    if (logoArea && !logoArea.querySelector('button')) {
      logoArea.style.cursor = 'pointer';
      logoArea.addEventListener('click', () => go('홈.html'));
    }
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => { e.preventDefault(); go('일정.html'); });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample1) {
            window.parent.navigateBackSample1();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const parent = span.closest('div, a, button');
        if (parent) {
          parent.style.cursor = 'pointer';
          parent.addEventListener('click', (e) => { e.preventDefault(); go('마이페이지.html'); });
        }
      }
    });
  }

  // 3. 페이지별 세부 버튼 & 카드 자동 연결
  document.querySelectorAll('button, a, section, div').forEach(el => {
    const text = (el.innerText || '').trim();
    const aria = el.getAttribute('aria-label') || '';

    // [로그인.html]
    if (el.id === 'login-btn' || (el.tagName === 'BUTTON' && (
      text.includes('카카오로 3초 만에 시작하기') ||
      text.includes('네이버로 시작하기') ||
      text.includes('Apple로 로그인') ||
      text.includes('먼저 둘러보기')
    ))) {
      el.addEventListener('click', () => go('홈.html'));
    }
    if (text.includes('1분만에 가입하고 육아 축하 웰컴팩 받기')) {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [아기.html]
    if (el.id === 'submitBtn') {
      el.onclick = (e) => {
        e.preventDefault();
        el.innerHTML = '<span class="material-symbols-outlined text-on-primary animate-spin text-[20px]">progress_activity</span><span class="text-on-primary font-headline-sm text-headline-sm font-bold">아이맞춤 환경 구성 중...</span>';
        setTimeout(() => go('홈.html'), 600);

<script id="ibom-sample1-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample1) {
      window.parent.navigateSample1(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 속성 기반 자동 매핑 (하단 네비게이션 바 & 헤더 & 관리자 메뉴)
  const pathMap = {
    'home': '홈.html',
    'baby-log-home': '육아기록.html',
    'community': '커뮤.html',
    'community-feed': '커뮤.html',
    'outing-map': '지도.html',
    'market': '마켓.html',
    'market-shop': '마켓.html',
    'my-page': '마이페이지.html',
    'mypage-settings': '마이페이지.html',
    'baby-growth': '아기.html',
    'dashboard': '관리자.html',
    'member-child-management': '아기.html',
    'community-moderation': '커뮤.html',
    'market-settlement': '마켓.html',
    'place-store-manager': '지도.html',
    'logs-monitoring': '육아기록.html',
    'system-settings': '관리자모바일.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 일정, 프로필 -> 마이페이지, 뒤로가기)
  const header = document.querySelector('header');
  if (header) {
    const logoArea = header.querySelector('.flex.items-center.gap-space-sm, .flex.items-center.gap-3');
    if (logoArea && !logoArea.querySelector('button')) {
      logoArea.style.cursor = 'pointer';
      logoArea.addEventListener('click', () => go('홈.html'));
    }
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => { e.preventDefault(); go('일정.html'); });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample1) {
            window.parent.navigateBackSample1();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const parent = span.closest('div, a, button');
        if (parent) {
          parent.style.cursor = 'pointer';
          parent.addEventListener('click', (e) => { e.preventDefault(); go('마이페이지.html'); });
        }
      }
    });
  }

<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-text-charcoal/90 text-surface px-4 py-2 rounded-full font-label-md text-label-md shadow-lg pointer-events-none opacity-0 transition-opacity duration-300 z-50" id="toast-msg">
  안내 메시지

<script>
  function showToast(text) {
    const toast = document.getElementById('toast-msg');
    if (!toast) return;
    toast.innerText = text;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2200);
  }

  function switchTab(tabId) {
    const tabs = ['following', 'followers', 'recommend'];
    tabs.forEach(t => {
      const el = document.getElementById(`tab-${t}`);
      if (!el) return;
      if (t === tabId) {
        el.className = "flex-1 py-2 rounded-full font-label-md text-label-md text-center transition-all bg-surface-card text-baby-peach shadow-sm";
        el.setAttribute('aria-selected', 'true');
      } else {
        el.className = "flex-1 py-2 rounded-full font-label-md text-label-md text-center text-text-subtle transition-all hover:text-text-charcoal";
        el.setAttribute('aria-selected', 'false');
      }
    });

    if (tabId === 'followers') {
      showToast('124명의 이웃 팔로워 리스트로 이동합니다.');
    } else if (tabId === 'recommend') {
      showToast('성동구 6개월령 맞춤 추천 친구 목록입니다.');
    }
  }

  function handleRequest(id, isAccept) {
    const item = document.getElementById(`request-item-${id}`);
    if (!item) return;
    
    item.style.transform = 'scale(0.95)';
    item.style.opacity = '0';
    item.style.transition = 'all 0.25s ease';

    setTimeout(() => {
      item.remove();
      const badge = document.getElementById('request-badge');
      if (badge) {
        const currentCount = parseInt(badge.innerText) || 1;
        const newCount = Math.max(0, currentCount - 1);
        badge.innerText = `${newCount}건`;
        if (newCount === 0) {
          const card = document.getElementById('friend-requests-card');
          if (card) {
            card.innerHTML = `<div class="p-2 text-center text-text-subtle font-body-sm text-body-sm">대기 중인 친구 요청이 모두 처리되었습니다 ✨</div>`;
          }
        }
      }
      showToast(isAccept ? '친구 요청을 수락했습니다! 🎉' : '친구 요청을 거절했습니다.');
    }, 250);
  }

  function toggleFollow(btn) {
    const isFollowing = btn.classList.contains('bg-surface-container');
    if (isFollowing) {
      btn.className = "px-3.5 py-1.5 rounded-full bg-peach-subtle text-baby-peach font-label-md text-label-md flex items-center gap-1 active:scale-95 transition-all shadow-sm";
      btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">person_add</span><span>팔로우</span>`;
      showToast('팔로우를 취소했습니다.');
    } else {
      btn.className = "px-3.5 py-1.5 rounded-full bg-surface-container text-text-charcoal font-label-md text-label-md flex items-center gap-1 active:scale-95 transition-all";
      btn.innerHTML = `<span class="material-symbols-outlined text-[16px] text-secondary" style="font-variation-settings: 'FILL' 1;">check</span><span>팔로잉</span>`;
      showToast('육아 친구를 팔로우했습니다! 일기를 함께 공유해요.');
    }
  }

  function toggleFollowingState(btn) {
    const isChecked = btn.innerText.includes('팔로잉');
    if (isChecked) {
      btn.innerHTML = `<span class="material-symbols-outlined text-[16px]">person_add</span><span>팔로우</span>`;
      btn.className = "px-2.5 py-1.5 rounded-full bg-peach-subtle text-baby-peach font-label-sm text-label-sm flex items-center gap-1 active:scale-95 transition-all";
      showToast('친구 관계가 해제되었습니다.');
    } else {
      btn.innerHTML = `<span class="material-symbols-outlined text-[16px] text-secondary" style="font-variation-settings: 'FILL' 1;">check</span><span>팔로잉 중</span>`;
      btn.className = "px-2.5 py-1.5 rounded-full bg-surface-container text-text-charcoal font-label-sm text-label-sm flex items-center gap-1 active:scale-95 transition-all";
      showToast('친구와 다시 연결되었습니다.');
    }
  }

  function setPrivacy(btn, mode) {
    const parent = btn.parentElement;
    if (!parent) return;
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(b => {
      b.className = "px-2 py-0.5 rounded-full text-text-subtle hover:text-text-charcoal transition-all";
    });
    btn.className = "px-2.5 py-0.5 rounded-full bg-surface-card text-baby-peach font-bold shadow-xs transition-all";
    
    const modeNames = { all: '전체공개', friends: '친구만 공개', private: '비공개' };
    showToast(`해당 친구의 육아일기 열람 권한이 [${modeNames[mode] || mode}]로 설정되었습니다.`);
  }

  function sendMessage(name) {
    showToast(`${name}님과의 1:1 안심 육아 채팅방으로 연결합니다.`);
  }

  function openQrModal() {
    showToast('내 육아 프로필 QR 코드를 생성합니다 📲');
  }

  function syncContacts() {
    showToast('안전하게 주소록 친구를 탐색하고 있습니다...');
  }
</script></main></div>
<script id="ibom-sample1-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample1) {
      window.parent.navigateSample1(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 속성 기반 자동 매핑 (하단 네비게이션 바 & 헤더 & 관리자 메뉴)
  const pathMap = {
    'home': '홈.html',
    'baby-log-home': '육아기록.html',
    'community': '커뮤.html',
    'community-feed': '커뮤.html',
    'outing-map': '지도.html',
    'market': '마켓.html',
    'market-shop': '마켓.html',
    'my-page': '마이페이지.html',
    'mypage-settings': '마이페이지.html',
    'baby-growth': '아기.html',
    'dashboard': '관리자.html',
    'member-child-management': '아기.html',
    'community-moderation': '커뮤.html',
    'market-settlement': '마켓.html',
    'place-store-manager': '지도.html',
    'logs-monitoring': '육아기록.html',
    'system-settings': '관리자모바일.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 일정, 프로필 -> 마이페이지, 뒤로가기)
  const header = document.querySelector('header');
  if (header) {
    const logoArea = header.querySelector('.flex.items-center.gap-space-sm, .flex.items-center.gap-3');
    if (logoArea && !logoArea.querySelector('button')) {
      logoArea.style.cursor = 'pointer';
      logoArea.addEventListener('click', () => go('홈.html'));
    }
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => { e.preventDefault(); go('일정.html'); });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample1) {
            window.parent.navigateBackSample1();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const parent = span.closest('div, a, button');
        if (parent) {
          parent.style.cursor = 'pointer';
          parent.addEventListener('click', (e) => { e.preventDefault(); go('마이페이지.html'); });
        }
      }
    });
  }

  // 3. 페이지별 세부 버튼 & 카드 자동 연결
  document.querySelectorAll('button, a, section, div').forEach(el => {
    const text = (el.innerText || '').trim();
    const aria = el.getAttribute('aria-label') || '';

    // [로그인.html]
    if (el.id === 'login-btn' || (el.tagName === 'BUTTON' && (
      text.includes('카카오로 3초 만에 시작하기') ||
      text.includes('네이버로 시작하기') ||
      text.includes('Apple로 로그인') ||
      text.includes('먼저 둘러보기')
    ))) {
      el.addEventListener('click', () => go('홈.html'));
    }
    if (text.includes('1분만에 가입하고 육아 축하 웰컴팩 받기')) {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [아기.html]
    if (el.id === 'submitBtn') {
      el.onclick = (e) => {
        e.preventDefault();
        el.innerHTML = '<span class="material-symbols-outlined text-on-primary animate-spin text-[20px]">progress_activity</span><span class="text-on-primary font-headline-sm text-headline-sm font-bold">아이맞춤 환경 구성 중...</span>';
        setTimeout(() => go('홈.html'), 600);
      };
    }

    // [홈.html]
    if (el.tagName === 'BUTTON' && text.includes('육아기록') && text.includes('빠른입력')) el.addEventListener('click', () => go('육아기록.html'));
    if (el.tagName === 'BUTTON' && text.includes('동네톡') && text.includes('성동구')) el.addEventListener('click', () => go('커뮤.html'));
    if (el.tagName === 'BUTTON' && text.includes('나들이지도') && text.includes('키즈존추천')) el.addEventListener('click', () => go('지도.html'));
    if (el.tagName === 'BUTTON' && text.includes('육아마켓') && text.includes('득템찬스')) el.addEventListener('click', () => go('마켓.html'));
    if (text === '생후 6개월차 chevron_right' || text === '오늘 우리 아이 브리핑') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => go('육아기록.html'));
    }
    if (text.includes('1:1 이웃 챗 시작') && el.tagName === 'DIV') {
      el.addEventListener('click', () => go('친구.html'));
    }
    if (text.includes('동네 모임방 만들기') && el.tagName === 'DIV') {
      el.addEventListener('click', () => go('커뮤.html'));
    }

    // [육아기록.html]
    if (text.includes('B형간염 3차 정기 접종일이에요') && el.tagName === 'SECTION') {

    if (text.includes('우리 아기 성장 발달 곡선 확인하기') && el.tagName === 'DIV') {

    // [마켓.html & 마켓랭킹.html]
    if (text === '실시간 TOP' || (el.tagName === 'BUTTON' && text.includes('인기순')) || (el.tagName === 'BUTTON' && text.includes('룩북 구경'))) {

    if (el.tagName === 'BUTTON' && text === '조회하기') {
      el.addEventListener('click', () => go('아기.html'));

      el.addEventListener('click', () => go('마켓.html'));
    }

    // [마이페이지.html]
    if (el.getAttribute('title') === '아기 추가' || el.id === 'babySwitchBtn') {
      el.addEventListener('click', () => go('아기.html'));

    toastText.textContent = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none');
    toast.classList.add('opacity-100');
    toastTimer = setTimeout(() => {

  document.querySelectorAll('.like-btn').forEach(btn => {

      const icon = btn.querySelector('.material-symbols-outlined');
      const countSpan = btn.querySelector('.like-count');
      let currentVal = parseInt(countSpan.textContent.replace(/,/g, ''), 10);

      if (isLiked) {
        btn.setAttribute('data-liked', 'false');
        icon.style.fontVariationSettings = "'FILL' 0";
        icon.classList.remove('text-baby-peach');
        countSpan.textContent = (currentVal - 1).toLocaleString();

        btn.setAttribute('data-liked', 'true');
        icon.style.fontVariationSettings = "'FILL' 1";
        icon.classList.add('text-baby-peach');
        countSpan.textContent = (currentVal + 1).toLocaleString();

<script>
  // Password Visibility Toggle Interaction
  const pwToggleBtn = document.getElementById('pw-toggle-btn');
  const pwInput = document.getElementById('password');
  const pwIcon = document.getElementById('pw-icon');

  if (pwToggleBtn && pwInput && pwIcon) {
    pwToggleBtn.addEventListener('click', () => {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      pwIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
    });
  }

  // Delight Mascot Tap Message
  const mascot = document.getElementById('mascot-badge');
  const toast = document.getElementById('cheer-toast');
  const cheerMessages = [
    "오늘 하루도 육아하느라 고생 많으셨어요! 🌿",
    "아기와 함께하는 작은 순간이 가장 큰 기적이에요 ✨",
    "아이봄이 항상 곁에서 든든히 함께할게요! 🧡",
    "엄마 아빠, 오늘도 정말 멋지게 해내고 있어요 🍼"
  ];
  let msgIdx = 0;

  if (mascot && toast) {
    mascot.addEventListener('click', () => {
      toast.textContent = cheerMessages[msgIdx % cheerMessages.length];
      msgIdx++;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      
      // Little Mascot Bounce
      mascot.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.15) rotate(4deg)' },
        { transform: 'scale(0.95) rotate(-4deg)' },
        { transform: 'scale(1)' }
      ], { duration: 400, easing: 'ease-out' });

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 3000);
    });
  }
</script></main></div>
<script id="ibom-sample1-router">
(function() {
  function go(page) {
    if (window.parent && window.parent.navigateSample1) {
      window.parent.navigateSample1(page);
    } else {
      window.location.href = page;
    }
  }

  // 1. data-path 속성 기반 자동 매핑 (하단 네비게이션 바 & 헤더 & 관리자 메뉴)
  const pathMap = {
    'home': '홈.html',
    'baby-log-home': '육아기록.html',
    'community': '커뮤.html',
    'community-feed': '커뮤.html',
    'outing-map': '지도.html',
    'market': '마켓.html',
    'market-shop': '마켓.html',
    'my-page': '마이페이지.html',
    'mypage-settings': '마이페이지.html',
    'baby-growth': '아기.html',
    'dashboard': '관리자.html',
    'member-child-management': '아기.html',
    'community-moderation': '커뮤.html',
    'market-settlement': '마켓.html',
    'place-store-manager': '지도.html',
    'logs-monitoring': '육아기록.html',
    'system-settings': '관리자모바일.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 일정, 프로필 -> 마이페이지, 뒤로가기)
  const header = document.querySelector('header');
  if (header) {
    const logoArea = header.querySelector('.flex.items-center.gap-space-sm, .flex.items-center.gap-3');
    if (logoArea && !logoArea.querySelector('button')) {
      logoArea.style.cursor = 'pointer';
      logoArea.addEventListener('click', () => go('홈.html'));
    }
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => { e.preventDefault(); go('일정.html'); });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample1) {
            window.parent.navigateBackSample1();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const parent = span.closest('div, a, button');
        if (parent) {
          parent.style.cursor = 'pointer';
          parent.addEventListener('click', (e) => { e.preventDefault(); go('마이페이지.html'); });
        }
      }
    });
  }

  // 3. 페이지별 세부 버튼 & 카드 자동 연결
  document.querySelectorAll('button, a, section, div').forEach(el => {
    const text = (el.innerText || '').trim();
    const aria = el.getAttribute('aria-label') || '';

    // [로그인.html]
    if (el.id === 'login-btn' || (el.tagName === 'BUTTON' && (
      text.includes('카카오로 3초 만에 시작하기') ||
      text.includes('네이버로 시작하기') ||
      text.includes('Apple로 로그인') ||
      text.includes('먼저 둘러보기')
    ))) {
      el.addEventListener('click', () => go('홈.html'));
    }
    if (text.includes('1분만에 가입하고 육아 축하 웰컴팩 받기')) {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [아기.html]
    if (el.id === 'submitBtn') {
      el.onclick = (e) => {
        e.preventDefault();
        el.innerHTML = '<span class="material-symbols-outlined text-on-primary animate-spin text-[20px]">progress_activity</span><span class="text-on-primary font-headline-sm text-headline-sm font-bold">아이맞춤 환경 구성 중...</span>';
        setTimeout(() => go('홈.html'), 600);
      };
    }

    // [홈.html]
    if (el.tagName === 'BUTTON' && text.includes('육아기록') && text.includes('빠른입력')) el.addEventListener('click', () => go('육아기록.html'));
    if (el.tagName === 'BUTTON' && text.includes('동네톡') && text.includes('성동구')) el.addEventListener('click', () => go('커뮤.html'));
    if (el.tagName === 'BUTTON' && text.includes('나들이지도') && text.includes('키즈존추천')) el.addEventListener('click', () => go('지도.html'));
    if (el.tagName === 'BUTTON' && text.includes('육아마켓') && text.includes('득템찬스')) el.addEventListener('click', () => go('마켓.html'));
    if (text === '생후 6개월차 chevron_right' || text === '오늘 우리 아이 브리핑') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => go('육아기록.html'));
    }
    if (text.includes('1:1 이웃 챗 시작') && el.tagName === 'DIV') {
      el.addEventListener('click', () => go('친구.html'));
    }
    if (text.includes('동네 모임방 만들기') && el.tagName === 'DIV') {
      el.addEventListener('click', () => go('커뮤.html'));
    }

    // [육아기록.html]
    if (text.includes('B형간염 3차 정기 접종일이에요') && el.tagName === 'SECTION') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => go('일정.html'));
    }
    if (text.includes('우리 아기 성장 발달 곡선 확인하기') && el.tagName === 'DIV') {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => go('아기.html'));
    }

    // [일정.html]
    if (aria === '아이 변경') {
      el.addEventListener('click', () => go('아기.html'));
    }

    // [커뮤.html]
    if (text.includes('동네 육아맘 2,410명 활동 중')) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => go('친구.html'));
    }

    // [마켓.html & 마켓랭킹.html]
    if (text === '실시간 TOP' || (el.tagName === 'BUTTON' && text.includes('인기순')) || (el.tagName === 'BUTTON' && text.includes('룩북 구경'))) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => go('마켓랭킹.html'));
    }
    if (el.tagName === 'BUTTON' && text === '조회하기') {
      el.addEventListener('click', () => go('아기.html'));
    }
    if (el.tagName === 'BUTTON' && text.includes('전체보기') && document.title.includes('Market')) {
      el.addEventListener('click', () => go('마켓.html'));
    }

    // [마이페이지.html]
    if (el.getAttribute('title') === '아기 추가' || el.id === 'babySwitchBtn') {
      el.addEventListener('click', () => go('아기.html'));
    }
    if (aria === '프로필 편집') {
      el.addEventListener('click', () => go('관리자모바일.html'));
    }
    if (el.tagName === 'BUTTON' && text === '로그아웃') {
      el.addEventListener('click', () => go('로그인.html'));
    }
    if (el.tagName === 'A' && (text.includes('찜한 상품') || text.includes('최근 본 상품'))) {
      el.setAttribute('href', '마켓랭킹.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('마켓랭킹.html'); });
    }
    if (el.tagName === 'A' && (text.includes('작성 가능한 리뷰') || text.includes('나눔/판매 내역'))) {
      el.setAttribute('href', '커뮤.html');
      el.addEventListener('click', (e) => { e.preventDefault(); go('커뮤.html'); });
    }

  function go(page) {

      window.location.href = page;
    }

  // 1. data-path 속성 기반 자동 매핑 (하단 네비게이션 바 & 헤더 & 관리자 메뉴)
  const pathMap = {
    'home': '홈.html',
    'baby-log-home': '육아기록.html',
    'community': '커뮤.html',
    'community-feed': '커뮤.html',
    'outing-map': '지도.html',
    'market': '마켓.html',
    'market-shop': '마켓.html',
    'my-page': '마이페이지.html',
    'mypage-settings': '마이페이지.html',
    'baby-growth': '아기.html',
    'dashboard': '관리자.html',
    'member-child-management': '아기.html',
    'community-moderation': '커뮤.html',
    'market-settlement': '마켓.html',
    'place-store-manager': '지도.html',
    'logs-monitoring': '육아기록.html',
    'system-settings': '관리자모바일.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 일정, 프로필 -> 마이페이지, 뒤로가기)
  const header = document.querySelector('header');
  if (header) {
    const logoArea = header.querySelector('.flex.items-center.gap-space-sm, .flex.items-center.gap-3');
    if (logoArea && !logoArea.querySelector('button')) {
      logoArea.style.cursor = 'pointer';
      logoArea.addEventListener('click', () => go('홈.html'));
    }
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => { e.preventDefault(); go('일정.html'); });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample1) {
            window.parent.navigateBackSample1();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }
        };
      }
    });
    header.querySelectorAll('span.material-symbols-outlined').forEach(span => {
      if (span.innerText.trim() === 'person') {
        const parent = span.closest('div, a, button');
        if (parent) {
          parent.style.cursor = 'pointer';
          parent.addEventListener('click', (e) => { e.preventDefault(); go('마이페이지.html'); });
        }
      }
    });
  }

  // 3. 페이지별 세부 버튼 & 카드 자동 연결

      text.includes('카카오로 3초 만에 시작하기') ||

      text.includes('Apple로 로그인') ||

      el.addEventListener('click', () => go('홈.html'));

    if (el.tagName === 'BUTTON' && text.includes('나들이지도') && text.includes('키즈존추천')) el.addEventListener('click', () => go('지도.html'));
    if (el.tagName === 'BUTTON' && text.includes('육아마켓') && text.includes('득템찬스')) el.addEventListener('click', () => go('마켓.html'));
    if (text === '생후 6개월차 chevron_right' || text === '오늘 우리 아이 브리핑') {

(function() {
  function go(page) {

      window.location.href = page;
    }
  }

  // 1. data-path 속성 기반 자동 매핑 (하단 네비게이션 바 & 헤더 & 관리자 메뉴)
  const pathMap = {
    'home': '홈.html',
    'baby-log-home': '육아기록.html',
    'community': '커뮤.html',
    'community-feed': '커뮤.html',
    'outing-map': '지도.html',
    'market': '마켓.html',
    'market-shop': '마켓.html',
    'my-page': '마이페이지.html',
    'mypage-settings': '마이페이지.html',
    'baby-growth': '아기.html',
    'dashboard': '관리자.html',
    'member-child-management': '아기.html',
    'community-moderation': '커뮤.html',
    'market-settlement': '마켓.html',
    'place-store-manager': '지도.html',
    'logs-monitoring': '육아기록.html',
    'system-settings': '관리자모바일.html'
  };

  document.querySelectorAll('[data-path]').forEach(el => {
    const key = el.getAttribute('data-path');
    if (pathMap[key]) {
      if (el.tagName === 'A') el.setAttribute('href', pathMap[key]);
      el.style.cursor = 'pointer';
      el.addEventListener('click', (e) => {
        e.preventDefault();
        go(pathMap[key]);
      });
    }
  });

  // 2. 상단 헤더 공통 연결 (로고 -> 홈, 알림 -> 일정, 프로필 -> 마이페이지, 뒤로가기)
  const header = document.querySelector('header');
  if (header) {
    const logoArea = header.querySelector('.flex.items-center.gap-space-sm, .flex.items-center.gap-3');
    if (logoArea && !logoArea.querySelector('button')) {
      logoArea.style.cursor = 'pointer';
      logoArea.addEventListener('click', () => go('홈.html'));
    }
    header.querySelectorAll('button').forEach(btn => {
      if (btn.innerText.includes('notifications')) {
        btn.addEventListener('click', (e) => { e.preventDefault(); go('일정.html'); });
      }
      if (btn.getAttribute('aria-label') && btn.getAttribute('aria-label').includes('뒤로')) {
        btn.onclick = (e) => {
          e.preventDefault();
          if (window.parent && window.parent.navigateBackSample1) {
            window.parent.navigateBackSample1();
          } else if (history.length > 1) {
            history.back();
          } else {
            go('홈.html');
          }

          parent.addEventListener('click', (e) => { e.preventDefault(); go('마이페이지.html'); });

        ${navPages.map(p => `<a href="${p.file}" style="display:block; padding:6px 8px; font-size:12px; font-weight:600; color:#2E2B2A; text-decoration:none; border-radius:8px;" onmouseover="this.style.background='#FDECE7';this.style.color='#a13e2e'" onmouseout="this.style.background='transparent';this.style.color='#2E2B2A'">${p.name}</a>`).join('')}
      </div>
      <button id="ux-nav-btn" title="전체 화면 이동 메뉴" style="position:fixed; bottom:80px; left:16px; z-index:9999; width:40px; height:40px; border-radius:9999px; background:#F47D68; color:#ffffff; border:none; box-shadow:0 4px 14px rgba(244,125,104,0.4); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:17px;">🧭</button>
    `;
    document.body.appendChild(helper);
    const btn = document.getElementById('ux-nav-btn');
    const menu = document.getElementById('ux-nav-menu');
    btn.addEventListener('click', () => {
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    });
  }
})();
</script>

</body></html>
  </template>
  <!-- ==================== [관리자.html 페이지 끝] ==================== -->


  <script>
    // 각 <template> 태그에서 페이지별 HTML 코드를 안전하게 불러옵니다.
    const PAGES = {};
    document.querySelectorAll('template.page-template').forEach(tpl => {
      const pageName = tpl.getAttribute('data-page');
      PAGES[pageName] = tpl.innerHTML;
    });

    const historyStack = ['홈.html'];
    let isMobileFrame = true;

    const frame = document.getElementById('proto-frame');
    const badge = document.getElementById('current-badge');

    window.navigateSample1 = function(pageName, pushHistory = true) {
      if (!PAGES[pageName]) return;
      if (pushHistory && historyStack[historyStack.length - 1] !== pageName) {
        historyStack.push(pageName);
      }
      frame.srcdoc = PAGES[pageName];
      badge.textContent = pageName;

      // PC 관리자 페이지(관리자.html)는 자동으로 전체화면 뷰로 전환하고, 모바일 화면은 모바일 뷰로 복귀
      const wrapper = document.getElementById('device-wrapper');
      const label = document.getElementById('frame-toggle-label');
      if (pageName === '관리자.html') {
        wrapper.className = 'w-full h-full overflow-hidden bg-[#FAF6F0] transition-all duration-300 relative';
        if (label) label.textContent = '전체화면 뷰';
      } else if (isMobileFrame) {
        wrapper.className = 'w-full max-w-[480px] h-full md:h-[94%] md:rounded-[36px] md:border-[6px] md:border-[#3d3937] overflow-hidden shadow-2xl bg-[#FAF6F0] transition-all duration-300 relative';
        if (label) label.textContent = '모바일 뷰';
      }

      document.querySelectorAll('.nav-pill').forEach(btn => {
        if (btn.getAttribute('data-file') === pageName) {
          btn.className = 'nav-pill shrink-0 px-2.5 py-1 rounded-full text-xs font-bold bg-[#F47D68] text-white shadow transition-all';
        } else {
          btn.className = 'nav-pill shrink-0 px-2.5 py-1 rounded-full text-xs font-semibold bg-[#31302d] text-[#e6e2dc] hover:bg-[#F47D68] hover:text-white transition-all';
        }
      });
    };

    window.navigateBackSample1 = function() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        window.navigateSample1(prev, false);
      } else {
        window.navigateSample1('홈.html', false);
      }
    };

    window.toggleDeviceFrame = function() {
      const wrapper = document.getElementById('device-wrapper');
      const label = document.getElementById('frame-toggle-label');
      isMobileFrame = !isMobileFrame;
      if (isMobileFrame) {
        wrapper.className = 'w-full max-w-[480px] h-full md:h-[94%] md:rounded-[36px] md:border-[6px] md:border-[#3d3937] overflow-hidden shadow-2xl bg-[#FAF6F0] transition-all duration-300 relative';
        label.textContent = '모바일 뷰';
      } else {
        wrapper.className = 'w-full h-full overflow-hidden bg-[#FAF6F0] transition-all duration-300 relative';
        label.textContent = '전체화면 뷰';
      }
    };

    // 초기 화면: 홈.html 로드
    window.navigateSample1('홈.html', false);
  </script>
</body>
